<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #050c0a;
    font: 400 1rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  
  .page {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
    background: #009B3A;
    overflow: hidden;
  }
  .page::before {
    content: "";
    position: absolute; inset: 0; z-index: -2;
    background: #DA291C;
    clip-path: polygon(0 0, 100% 0, 0 40%);
  }
  .page::after {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse farthest-corner at 50% 50%,
        rgba(0, 0, 0, .294) 0%, rgba(0, 0, 0, .285) 25%, rgba(0, 0, 0, .258) 50%,
        rgba(0, 0, 0, .213) 75%, rgba(0, 0, 0, .15) 100%),
      radial-gradient(ellipse farthest-corner at 50% 50%,
        rgba(5, 12, 10, 1) 0%, rgba(5, 12, 10, .969) 25%, rgba(5, 12, 10, .878) 50%,
        rgba(5, 12, 10, .726) 75%, rgba(5, 12, 10, .512) 100%);
  }


  .tuile {
    width: min(100%, 24rem);
    min-height: min(34rem, 72vh);
    min-height: min(34rem, 72svh);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem 1.5rem 1.5rem;
    border-radius: 1.5rem;
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 255, 255, .3);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .35);
    animation: entree .85s cubic-bezier(.34, 1.56, .64, 1) backwards;
  }
  .logo {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img {
    display: block;
    width: 100%;
    max-width: 20rem;
    height: auto;
    object-fit: contain;
}


  .telecharger {
    display: block;
    width: 100%;
    padding: 1rem 1.2rem;
    text-align: center;
    color: #F5FAF7;
    font-size: 1.15rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: .9rem;
    background: rgba(214, 166, 33, .16);
    border: 1.5px solid rgba(217, 166, 33, .8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
    transition: transform .14s ease-out, background .2s;
    animation:
      montee .7s .85s cubic-bezier(.34, 1.56, .64, 1) backwards,
      halo 2.8s 1.8s ease-in-out infinite;
  }
  .telecharger:hover { background: rgba(214, 166, 33, .28); }
  .telecharger:active { transform: scale(.96); }
  .telecharger:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @keyframes entree {
    from { opacity: 0; transform: translateY(3rem) scale(.93); }
  }
  @keyframes apparition {
    from { opacity: 0; transform: scale(.8); }
  }
  @keyframes montee {
    from { opacity: 0; transform: translateY(1.2rem); }
  }
  @keyframes respiration {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes halo {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 0 0 0 rgba(217, 166, 33, 0); }
    50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 0 1.2rem .1rem rgba(217, 166, 33, .5); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tuile, .logo img, .telecharger { animation: none; }
  }
</style>
</head>

      <div class="compteur">
